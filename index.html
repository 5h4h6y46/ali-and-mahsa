<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>علی و مهسا | ۹ مهر</title>

<style>
  :root {
    --ink: #171717;
    --gold: #9c8250;
    --soft: #6d6d6d;
    --line: rgba(156,130,80,.28);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: #fff;
  }

  body {
    min-height: 100svh;
    color: var(--ink);
    font-family: "Vazirmatn", "IRANSans", "B Nazanin", Tahoma, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /*
    The frame is NOT full-screen anymore.

    Its width responds to the viewport exactly like the rest of the design.
    Because the original frame is 1024 × 1536 (2:3), aspect-ratio keeps it
    proportional at every screen size.
  */
  .page {
    position: relative;
    min-height: 100svh;
    display: grid;
    place-items: center;
    overflow: hidden;
    padding: clamp(16px, 3vw, 40px);
    background: #fff;
  }

  .frame {
    position: absolute;
    z-index: 0;

    /* Responsive frame size */
    width: min(
      92vw,
      620px,
      calc(100svh * 2 / 3)
    );

    aspect-ratio: 2 / 3;
    height: auto;

    object-fit: contain;
    object-position: center;

    pointer-events: none;
    user-select: none;
  }

  .content {
    position: relative;
    z-index: 1;

    /*
      Content width follows the frame.
      clamp() makes the entire composition grow/shrink smoothly.
    */
    width: min(72%, 445px);
    text-align: center;

    padding:
      clamp(28px, 6vw, 60px)
      clamp(14px, 4vw, 36px);
  }

  .eyebrow {
    margin: 0 0 clamp(14px, 2.8vw, 24px);
    color: var(--gold);
    font-size: clamp(9px, 1.6vw, 13px);
    letter-spacing: .16em;
    line-height: 2;
  }

  .names {
    margin: 0;
    font-family: Georgia, "Times New Roman", "B Nazanin", serif;
    font-weight: 400;
    font-size: clamp(34px, 7vw, 70px);
    line-height: 1.35;
    white-space: nowrap;
  }

  .amp {
    color: var(--gold);
    font-size: .48em;
    margin: 0 .12em;
    vertical-align: .1em;
  }

  .ornament {
    width: clamp(80px, 16vw, 150px);
    height: 1px;
    margin: clamp(18px, 3vw, 28px) auto clamp(15px, 2.5vw, 23px);
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .date {
    margin: 0;
    font-size: clamp(23px, 4.8vw, 40px);
    font-weight: 400;
    line-height: 1.6;
  }

  .subtitle {
    margin: 3px 0 0;
    color: var(--soft);
    font-size: clamp(9px, 1.8vw, 14px);
    line-height: 2;
  }

  .details {
    width: 100%;
    margin: clamp(22px, 4vw, 34px) auto 0;
  }

  .detail {
    padding: clamp(8px, 1.7vw, 13px) 8px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    color: var(--soft);
    font-size: clamp(10px, 1.8vw, 14px);
  }

  .detail strong {
    color: var(--ink);
    font-weight: 500;
  }

  .actions {
    margin-top: clamp(17px, 3vw, 25px);
  }

  .map-button {
    display: inline-block;
    padding: clamp(7px, 1.5vw, 10px) clamp(13px, 2.5vw, 19px);
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--gold);
    text-decoration: none;
    font-size: clamp(9px, 1.7vw, 13px);
    background: rgba(255,255,255,.78);
  }

  .map-button.disabled {
    opacity: .48;
    pointer-events: none;
  }

  .footer {
    margin: clamp(20px, 3.5vw, 32px) 0 0;
    color: rgba(23,23,23,.42);
    font-size: clamp(8px, 1.4vw, 11px);
  }

  /*
    Very narrow phones:
    The frame remains proportional, while the content gets a little wider
    relative to it so the Persian text stays readable.
  */
  @media (max-width: 430px) {
    .page {
      padding: 10px;
    }

    .frame {
      width: min(94vw, calc(100svh * 2 / 3));
    }

    .content {
      width: 76%;
      padding-inline: 8px;
    }
  }

  /*
    Landscape phones / short screens:
    Size the frame from the available height so it never gets cropped.
  */
  @media (max-height: 620px) {
    .frame {
      width: min(78vw, calc(100svh * 2 / 3));
    }

    .content {
      width: 70%;
      padding-block: 15px;
    }

    .eyebrow {
      margin-bottom: 8px;
    }

    .ornament {
      margin-top: 10px;
      margin-bottom: 9px;
    }

    .details {
      margin-top: 12px;
    }

    .actions {
      margin-top: 10px;
    }

    .footer {
      margin-top: 12px;
    }
  }
</style>
</head>
